<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Concentração</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Calculadora de Concentração</h1>

        <div class="formulario">

            <div class="input-group">
                <label>Caixa 1</label>
                <input type="number" step="0.01" id="cx1">
            </div>

            <div class="input-group">
                <label>Caixa 2</label>
                <input type="number" step="0.01" id="cx2">
            </div>

            <div class="input-group">
                <label>Caixa 3</label>
                <input type="number" step="0.01" id="cx3">
            </div>

            <div class="input-group">
                <label>Caixa 4</label>
                <input type="number" step="0.01" id="cx4">
            </div>

            <div class="input-group">
                <label>Cone</label>
                <input type="number" step="0.01" id="cone">
            </div>

            <div class="input-group">
                <label>Retalheira</label>
                <input type="number" step="0.01" id="retalheira">
            </div>

            <div class="input-group">
                <label>Masseira</label>
                <input type="number" step="0.01" id="masseira">
            </div>

            <div class="input-group">
                <label>HM</label>
                <input type="number" step="0.01" id="hm">
            </div>

            <button onclick="calcular()">
                Calcular
            </button>

        </div>

    </div>

    <div id="resultado"></div>

</div>

<script src="script.js"></script>

</body>
</html>
