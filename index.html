<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Concentração</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Calculadora de Concentração e Decantação</h1>

<div class="formulario">

    <div class="input-group">
        <label for="cx1">Caixa 1</label>
        <input type="number" id="cx1" step="0.01">
    </div>

    <div class="input-group">
        <label for="cx2">Caixa 2</label>
        <input type="number" id="cx2" step="0.01">
    </div>

    <div class="input-group">
        <label for="cx3">Caixa 3</label>
        <input type="number" id="cx3" step="0.01">
    </div>

    <div class="input-group">
        <label for="cx4">Caixa 4</label>
        <input type="number" id="cx4" step="0.01">
    </div>

    <div class="input-group">
        <label for="cone">Cone</label>
        <input type="number" id="cone" step="0.01">
    </div>

    <div class="input-group">
        <label for="retalheira">Retalheira</label>
        <input type="number" id="retalheira" step="0.01">
    </div>

    <div class="input-group">
        <label for="masseira">Masseira</label>
        <input type="number" id="masseira" step="0.01">
    </div>

    <div class="input-group">
        <label for="hm">HM</label>
        <input type="number" id="hm" step="0.01">
    </div>

    <button onclick="calcular()">Calcular</button>

</div>
    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
